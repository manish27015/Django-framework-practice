{% extends 'base.html' %}

{% block blockname %}

<section id="contact" class="marksheet-section">

    <div class="marksheet-container">

        <h2>MARKSHEET</h2>

        <form method="POST">
            {% csrf_token %}

            <!-- Subjects -->
            <div class="subjects-grid">

                <div class="form-group">
                    <label for="num1">Subject 1</label>
                    <input type="number" id="num1" name="subject1" required>
                </div>

                <div class="form-group">
                    <label for="num2">Subject 2</label>
                    <input type="number" id="num2" name="subject2" required>
                </div>

                <div class="form-group">
                    <label for="num3">Subject 3</label>
                    <input type="number" id="num3" name="subject3" required>
                </div>

                <div class="form-group">
                    <label for="num4">Subject 4</label>
                    <input type="number" id="num4" name="subject4" required>
                </div>

                <div class="form-group">
                    <label for="num5">Subject 5</label>
                    <input type="number" id="num5" name="subject5" required>
                </div>

            </div>

            <!-- Button -->
            <div class="button-box">
                <button type="submit">Marksheet</button>
            </div>

            <!-- Result -->
            <div class="result-grid">

                <div class="form-group">
                    <label>Total</label>
                    <input type="text" value="{{ total }}" readonly>
                </div>

                <div class="form-group">
                    <label>Percentage</label>
                    <input type="text" value="{{ per }}" readonly>
                </div>

                <div class="form-group">
                    <label>Division</label>
                    <input type="text" value="{{ div }}" readonly>
                </div>

            </div>

        </form>

    </div>

</section>

{% endblock %}
