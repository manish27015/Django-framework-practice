{% extends 'base.html' %}
    {% block blockname %}

{% comment %} {% include "header.html" %} {% endcomment %}
    <!-- Contact Section -->
    <section id="contact" class="section contact-section">

        <h2>
            Contact Us
        </h2>

        <form method="post" action="{% url 'saveenquiry' %}" id="contactForm">
            {{n}}
        {% csrf_token %}

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Enter your Number"
                required
            >

            <input
                type="text"
                id="courses"
                name="courses"
                placeholder="Enter your Courses"
                required
            >

            <textarea
                id="message"
                name="message"
                placeholder="Enter your message"
                required
            ></textarea>

            <button   button type="submit" class="btn">
                Send Message
            </button>

        </form>
    </section>

{% comment %} {% include "footer.html" %} {% endcomment %}
{% endblock %}
