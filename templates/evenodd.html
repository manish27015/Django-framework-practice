{% extends 'base.html' %}
    {% block blockname %}

    <section id="contact" class="section contact-section">

        <h2>
            EVEN AND ODD
        </h2>
        <div class="row">
            <div class="col-12">
                <form method="post">
                    
                    {% if error %}
                    <div class="alert alert-danger" role="alert">
                        Please enter the value
                    </div>
                    {% endif %}
                        
                    {% csrf_token %}
                    <label>Value 1</label>
                    <input type="text" name="num1" class="form-control"/>
                    
                    <button type="submit">Even | Odd</button>

                    <label>Output</label>
                    <input type="text" value="{{c}}" class="form-control"/>
                </form> 
            </div>
        </div>

    </section>
{% endblock %}
